<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Planner</title>
  <meta name="description" content="Plan your day, calendar, reminders and yearly goals.">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme and language before first paint to avoid a flash.
    (function () {
      var s = {};
      try { s = (JSON.parse(localStorage.getItem('dailyPlanner.data.v2')) || {}).settings || {}; } catch (e) {}
      var theme = s.theme || 'system';
      var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      var lang = s.lang === 'en' ? 'en' : 'ckb';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#view" data-t="Skip to content">Skip to content</a>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation" data-t-aria="Main navigation">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="34" height="34">
        <div>
          <strong data-t="Daily Planner">Daily Planner</strong>
          <span data-t="Plan · Do · Grow">Plan · Do · Grow</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebarFoot"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="pageTitle">My Day</h1>
          <span id="clock" class="clock"></span>
        </div>
        <div class="topbar-actions">
          <button class="btn ghost" data-global="new-event" data-t-title="New event" title="New event">
            <span data-icon="calendar"></span><span class="hide-sm" data-t="Event">Event</span>
          </button>
          <button class="btn primary" data-global="new-task" data-t-title="New task" title="New task">
            <span data-icon="plus"></span><span class="hide-sm" data-t="Task">Task</span>
          </button>
        </div>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation" data-t-aria="Main navigation"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/lang-ckb.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/components.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/ics.js"></script>
  <script src="js/safety.js"></script>
  <script src="js/money.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/habits.js"></script>
  <script src="js/views/goals.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/review.js"></script>
  <script src="js/views/money.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
