<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Planner</title>
  <meta name="description" content="Plan your day, calendar, reminders and yearly goals.">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash.
    (function () {
      var theme = 'system';
      try { theme = (JSON.parse(localStorage.getItem('dailyPlanner.data.v2')) || {}).settings.theme || 'system'; } catch (e) {}
      var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="34" height="34">
        <div>
          <strong>Daily Planner</strong>
          <span>Plan · Do · Grow</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebarFoot"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="pageTitle">My Day</h1>
          <span id="clock" class="clock"></span>
        </div>
        <div class="topbar-actions">
          <button class="btn ghost" data-global="new-event" title="New event (E)">
            <span data-icon="calendar"></span><span class="hide-sm">Event</span>
          </button>
          <button class="btn primary" data-global="new-task" title="New task (N)">
            <span data-icon="plus"></span><span class="hide-sm">Task</span>
          </button>
        </div>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/components.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/ics.js"></script>
  <script src="js/safety.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/habits.js"></script>
  <script src="js/views/goals.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
